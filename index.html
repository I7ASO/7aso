<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الاستقبال الذكي 2026</title>
  
  <!-- خط تجريدي عصري -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.65);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #06b6d4;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Readex Pro', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* خلفية متدرجة متفاعلة 2026 */
    .glow-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      right: -100px;
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
    }

    .glow-orb-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(0,0,0,0) 70%);
      bottom: -80px;
      left: -80px;
      z-index: 0;
      animation: float 8s infinite alternate-reverse ease-in-out;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 50px) scale(1.1); }
    }

    /* بطاقة التصميم الزجاجي */
    .app-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.56);
      transition: transform 0.3s ease;
    }

    .app-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .app-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--text-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .app-header p {
      color: var(--text-dim);
      font-size: 0.875rem;
      margin-top: 6px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: rgba(255, 255, 255, 0.05);
    }

    input::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    button {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border: none;
      border-radius: 16px;
      padding: 16px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px -4px var(--primary-glow);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px var(--primary-glow);
      opacity: 0.95;
    }

    button:active {
      transform: translateY(0);
    }

    /* صندوق العرض التفاعلي */
    .output-card {
      margin-top: 32px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--border);
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .output-card.active {
      border-style: solid;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.05);
    }

    .output-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #output {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="glow-orb"></div>
  <div class="glow-orb-2"></div>

  <main class="app-card">
    <header class="app-header">
      <h1>مرحبًا بك</h1>
      <p>أدخل بياناتك للمتابعة إلى النظام</p>
    </header>

    <div class="input-group">
      <div class="input-wrapper">
        <input id="name" type="text" placeholder="اكتب اسمك هنا..." autocomplete="off">
      </div>
      <button onclick="show()">تأكيد وإرسال</button>
    </div>

    <div class="output-card" id="outputContainer">
      <span class="output-label">النتيجة</span>
      <div id="output">بانتظار المدخلات...</div>
    </div>
  </main>

  <script>
    function show() {
      const nameInput = document.getElementById("name");
      const outputDiv = document.getElementById("output");
      const outputContainer = document.getElementById("outputContainer");
      const value = nameInput.value.trim();

      if (value !== "") {
        // آمن ومحمي من ثغرة XSS باستخدام textContent
        outputDiv.textContent = value;
        outputContainer.classList.add("active");
      } else {
        outputDiv.textContent = "يرجى كتابة اسم أولاً!";
        outputContainer.classList.remove("active");
      }
    }
  </script>

</body>
</html>
